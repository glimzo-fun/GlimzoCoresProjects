# GlimzoCore Configuration
# -------------------------

# MySQL database connection
mysql:
  host: "localhost"
  port: 3306
  database: "glimzocore"
  username: "root"
  password: "pikashrey"
  pool-size: 10

# Server links (shown in /discord, /store, /forums)
discord-link: "discord.gg/glimzo"
store-link: "store.glimzo.net"
forums-link: "forums.glimzo.net"

# Season configuration
season:
  number: 1
  # Unix epoch milliseconds - set to your actual dates
  start: 0
  end: 9999999999999
  tick-interval-ticks: 200

# Task intervals (in ticks; 20 ticks = 1 second)
announcer:
  interval-ticks: 1200
  messages:
    - "&2&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "    &a&l🌿 Welcome to &2&lGlimzo Network &a&l🌿"
    - "&8   The forest awaits you — play.glimzo.fun"
    - "&2&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - ""
    - "&2&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "  &7Join our community &8» &adiscord.gg/glimzo"
    - "  &7Support the server &8» &2store.glimzo.fun"
    - "&2&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

autosave:
  interval-ticks: 6000

social:
  sync-interval-ticks: 200    # How often to poll MySQL for social events (fallback when Redis is off)

leaderboard:
  interval-ticks: 12000
  top-size: 10



# Discord webhook integration (optional)
discord:
  enabled: false
  log-webhook: ""
  staff-webhook: ""
  ban-webhook: ""

# Server identity - used in rank audit logs and cross-server sync.
# Each server in your network must have a unique id.
server:
  id: "lobby-1"

# Rank system
ranks:
  dangerous-threshold-weight: 1500  # weight >= this requires glimzocore.rank.grant.dangerous
  # How often to poll the MySQL audit log for rank changes from other servers.
  # Only used when Redis is not configured. Default 200 ticks = 10 seconds.
  sync-interval-ticks: 200

# Redis pub/sub for instant cross-server rank sync (optional but recommended).
# If disabled or Jedis is missing, the system falls back to MySQL polling above.
redis:
  enabled: true
  host: "redis-11877.c267.us-east-1-4.ec2.cloud.redislabs.com"
  port: 11877
  password: "8okcA6SB31Gi4oqYg5xWGjw24qBHrz0l"           # leave empty if no AUTH required
  channel: "glimzo:rank"        # rank sync channel - must match across all servers
  social-channel: "glimzo:social" # social sync channel - must match across all servers

# Lobby spawn location — set with /setspawn
spawn:
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# VPN / Proxy detection
# Players without Baron+ rank who connect via VPN or proxy are blocked.
# Uses ip-api.com (free, no API key required, 45 req/min limit).
vpn:
  enabled: true
  # Minimum rank weight required to bypass VPN check.
  # Baron = 100. Set to 0 to disable the rank bypass entirely.
  bypass-weight: 100
  # Timeout in milliseconds for the VPN API call.
  # If the API times out, the player is ALLOWED through (fail-open).
  timeout-ms: 3000

