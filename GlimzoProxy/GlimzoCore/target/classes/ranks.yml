# GlimzoCore - Rank Definitions
# ==============================
# Rank ladder (highest → lowest weight):
#   Staff:  chief > admin > architect > pibble > guardian > guide > supportagents
#   Creator: creators
#   Donor:  cosmos > ascendant > famed > legendary > mythic > warden > baron
#   Default: default
#
# Every rank inherits the one directly below it in the ladder.
# Colours match the original rank icon colours exactly.

ranks:

  # ─────────────────────────────────────────────────────────────────
  # DEFAULT — base rank, inherited by everyone
  # ─────────────────────────────────────────────────────────────────
  default:
    weight: 0
    prefix: "&7"
    donor: false
    staff: false
    default: true
    permissions:
      - rank.default
    inheritance: []

  # ─────────────────────────────────────────────────────────────────
  # DONOR RANKS  (baron is lowest, cosmos is highest)
  # ─────────────────────────────────────────────────────────────────

  baron:
    weight: 100
    # Orange/Brown icon in screenshot
    prefix: "&6[BARON] "
    donor: true
    staff: false
    default: false
    max-clan-size: 15
    permissions:
      - rank.baron
      - glimzocore.fly
    inheritance:
      - default

  warden:
    weight: 200
    # Dark Blue icon in screenshot
    prefix: "&1[WARDEN] "
    donor: true
    staff: false
    permissions:
      - rank.warden
    inheritance:
      - baron

  mythic:
    weight: 300
    # Lavender/Light Purple icon in screenshot
    prefix: "&d[MYTHIC] "
    donor: true
    staff: false
    permissions:
      - rank.mythic
    inheritance:
      - warden

  legendary:
    weight: 400
    # Yellow/Gold icon in screenshot
    prefix: "&e[LEGENDARY] "
    donor: true
    staff: false
    permissions:
      - rank.legendary
      - glimzocore.clan.create
    inheritance:
      - mythic

  famed:
    weight: 500
    # Red icon in screenshot (darker — &4 to differ from admin's &c)
    prefix: "&4[FAMED] "
    donor: true
    staff: false
    permissions:
      - rank.famed
      - cosmetics.special
    inheritance:
      - legendary

  ascendant:
    weight: 600
    # Green icon in screenshot (light green — &a)
    prefix: "&a[ASCENDANT] "
    donor: true
    staff: false
    permissions:
      - rank.ascendant
    inheritance:
      - famed

  cosmos:
    weight: 700
    # Purple icon in screenshot
    prefix: "&5[COSMOS] "
    donor: true
    staff: false
    permissions:
      - rank.cosmos
      - cosmetics.all
    inheritance:
      - ascendant

  # ─────────────────────────────────────────────────────────────────
  # COMMUNITY / CONTENT ROLE
  # ─────────────────────────────────────────────────────────────────

  creators:
    weight: 900
    # Dark Red icon in screenshot
    prefix: "&4[CREATOR] "
    donor: false
    staff: false
    permissions:
      - rank.creator
      - media.tools
    inheritance:
      - baron

  # ─────────────────────────────────────────────────────────────────
  # STAFF RANKS  (supportagents is lowest, chief is highest)
  # Each inherits the one below it in the staff chain.
  # The bottom staff rank (supportagents) inherits baron so staff
  # always have at minimum donor-tier permissions.
  # ─────────────────────────────────────────────────────────────────

  supportagents:
    weight: 1000
    # Cyan/Teal icon in screenshot
    prefix: "&3[SUPPORT] "
    donor: false
    staff: true
    permissions:
      - rank.support
      - staff.support
    inheritance:
      - baron

  guide:
    weight: 1100
    # Orange/Gold icon in screenshot
    prefix: "&6[GUIDE] "
    donor: false
    staff: true
    permissions:
      - rank.guide
      - staff.guide
    inheritance:
      - supportagents

  guardian:
    weight: 1200
    # Green icon in screenshot (dark green — &2)
    prefix: "&2[GUARDIAN] "
    donor: false
    staff: true
    permissions:
      - rank.guardian
      - staff.guardian
    inheritance:
      - guide

  pibble:
    weight: 1300
    # Purple/Pink icon in screenshot — light purple &d
    prefix: "&d[PIBBLE] "
    donor: false
    staff: true
    permissions:
      - rank.pibble
      - staff.pibble
    inheritance:
      - guardian

  architect:
    weight: 1400
    # Cyan/Blue icon in screenshot — aqua &b
    prefix: "&b[ARCHITECT] "
    donor: false
    staff: true
    permissions:
      - rank.architect
      - staff.architect
    inheritance:
      - pibble

  admin:
    weight: 1500
    # Red icon in screenshot — &c
    prefix: "&c[ADMIN] "
    donor: false
    staff: true
    permissions:
      - rank.admin
      - staff.admin
      - glimzo.admin.build
      - glimzo.admin.reload
    inheritance:
      - architect

  chief:
    weight: 1600
    # Pink/Magenta icon in screenshot — &d bold
    prefix: "&4&l[CHIEF] "
    donor: false
    staff: true
    permissions:
      - rank.chief
      - staff.chief
      - cosmetics.ally
      - glimzo.rank.grant.dangerous
    inheritance:
      - admin
