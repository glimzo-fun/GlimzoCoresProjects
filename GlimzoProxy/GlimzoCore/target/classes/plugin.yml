name: GlimzoCore
main: me.pikashrey.glimzocore.GlimzoCore
version: 1.0.0-SNAPSHOT
api-version: 1.8
author: Pikashrey
softdepend: [PlaceholderAPI, Vault]

# ─── ALIAS AUDIT ──────────────────────────────────────────────────────────────
# Rules applied:
#   - /p  → party ONLY  (was wrongly on profile — conflict removed)
#   - /f  → friend
#   - /fl → friendlist
#   - /r  → reply (already correct)
#   - /v  → vanish (already correct)
#   - /bc → broadcast (already correct)
#   - /ss → socialspy (already correct)
#   - /cc → clearchat (already correct)
#   - profile → NO aliases (just /profile)
#   - Every command gets at most 1-2 short, non-conflicting aliases
# ──────────────────────────────────────────────────────────────────────────────

commands:
  # ── Punishments ────────────────────────────────────────────────────────────
  ban:
    description: "Permanently ban a player"
    usage: "/ban <player> [reason]"
    aliases: [permban]
  tempban:
    description: "Temporarily ban a player"
    usage: "/tempban <player> <duration> [reason]"
    aliases: [tban]
  unban:
    description: "Unban a player"
    usage: "/unban <player>"
    aliases: [pardon]
  mute:
    description: "Mute a player"
    usage: "/mute <player> [reason]"
  unmute:
    description: "Unmute a player"
    usage: "/unmute <player>"
  kick:
    description: "Kick a player"
    usage: "/kick <player> [reason]"
  warn:
    description: "Warn a player"
    usage: "/warn <player> <reason>"
  history:
    description: "View punishment history"
    usage: "/history <player>"
    aliases: [ph]
  warnings:
    description: "View warnings"
    usage: "/warnings [player]"
    aliases: [warns]
  check:
    description: "Check player punishment status"
    usage: "/check <player>"
  alts:
    description: "Check alt accounts"
    usage: "/alts <player>"
  checknick:
    description: "Check nicked players"
    usage: "/checknick [nick]"

  # ── Economy ────────────────────────────────────────────────────────────────
  coins:
    description: "Manage coins"
    usage: "/coins [give|take|set|check] [player] [amount]"
  gems:
    description: "Manage gems"
    usage: "/gems [give|take|set|check] [player] [amount]"

  # ── Rank ───────────────────────────────────────────────────────────────────
  rank:
    description: "Rank management"
    usage: "/rank [grant|revoke|check] ..."
    aliases: [ranks]
  giftrank:
    description: "Gift a donor rank"
    usage: "/giftrank <player> <rank>"
  setprefix:
    description: "Set custom prefix"
    usage: "/setprefix <prefix>"

  # ── Leveling ───────────────────────────────────────────────────────────────
  level:
    description: "View level progress"
    usage: "/level [rewards|prestige]"
    aliases: [lvl, xp]
  prestige:
    description: "Open prestige menu"
    usage: "/prestige"

  # ── Social ─────────────────────────────────────────────────────────────────
  friend:
    description: "Friend system"
    usage: "/friend [add|accept|deny|remove|list]"
    aliases: [friends, f]        # /f = friend  |  NOT /fl (that's friendlist)
  friendlist:
    description: "View friend list GUI"
    usage: "/friendlist"
    aliases: [fl]                # /fl = friendlist
  party:
    description: "Party system"
    usage: "/party [invite|accept|decline|leave|disband|chat|list]"
    aliases: [p]                 # /p = party  (was wrongly on /profile — fixed)
  clan:
    description: "Clan system"
    usage: "/clan [create|invite|accept|leave|menu|top|perks|...]"
    aliases: [clans]

  # ── Profile & Stats ────────────────────────────────────────────────────────
  profile:
    description: "View player profile"
    usage: "/profile [player]"
    # NO aliases — /p is party, profile is just /profile
  stats:
    description: "View player stats menu"
    usage: "/stats [player]"
    aliases: [mystats]
  settings:
    description: "Toggle player settings"
    usage: "/settings [setting]"
    aliases: [options, prefs]

  # ── Messaging ──────────────────────────────────────────────────────────────
  msg:
    description: "Send a private message"
    usage: "/msg <player> <message>"
    aliases: [w, tell, dm]
  message:
    description: "Send a private message"
    usage: "/message <player> <message>"
  reply:
    description: "Reply to last message"
    usage: "/reply <message>"
    aliases: [r]
  ignore:
    description: "Ignore a player"
    usage: "/ignore <player>"
    aliases: [block]
  socialspy:
    description: "Toggle social spy"
    usage: "/socialspy"
    aliases: [ss]

  # ── Essential ──────────────────────────────────────────────────────────────
  nick:
    description: "Set a nickname"
    usage: "/nick [name]"
    aliases: [nickname]
  unnick:
    description: "Remove your nickname"
    usage: "/unnick [player]"
    aliases: [unnickname]
  ping:
    description: "Check ping"
    usage: "/ping [player]"
    aliases: [ms]
  fly:
    description: "Toggle flight"
    usage: "/fly"
  spawn:
    description: "Teleport to spawn"
    usage: "/spawn"
    aliases: [hub, lobby]
  setspawn:
    description: "Set server spawn"
    usage: "/setspawn"
  visibility:
    description: "Toggle player visibility"
    usage: "/visibility"
    aliases: [vis, players]
  whereami:
    description: "View your coordinates"
    usage: "/whereami"
    aliases: [coords, pos]
  discord:
    description: "Discord invite link"
    usage: "/discord"
    aliases: [dc]
  store:
    description: "Store link"
    usage: "/store"
    aliases: [shop, buy]
  forums:
    description: "Forums link"
    usage: "/forums"
  report:
    description: "Report a player"
    usage: "/report <player> <reason>"
  emojis:
    description: "View available symbols"
    usage: "/emojis"
    aliases: [symbols]
  help:
    description: "Help menu"
    usage: "/help"

  # ── Staff ──────────────────────────────────────────────────────────────────
  vanish:
    description: "Toggle vanish"
    usage: "/vanish"
    aliases: [v, invis]
  staff:
    description: "Toggle staff mode"
    usage: "/staff"
    aliases: [staffmode, sm]
  broadcast:
    description: "Broadcast a message"
    usage: "/broadcast <message>"
    aliases: [bc, announce]
  alert:
    description: "Alert staff"
    usage: "/alert <message>"
    aliases: [ac]
  sc:
    description: "Staff chat"
    usage: "/sc <message>"
    aliases: [staffchat]
  tempmute:
    description: "Temporarily mute a player"
    usage: "/tempmute <player> <duration> [reason]"
    aliases: [tmute]
  freeze:
    description: "Freeze a player"
    usage: "/freeze <player>"
    aliases: [fz]
  invsee:
    description: "View player inventory"
    usage: "/invsee <player>"
    aliases: [is]
  clearchat:
    description: "Clear chat"
    usage: "/clearchat"
    aliases: [cc]
  mail:
    description: "Personal mail system"
    usage: "/mail [send <player> <msg>|delete <id>]"

  # ── Season / Progression ───────────────────────────────────────────────────
  season:
    description: "Season info and menu"
    usage: "/season [info|top|addxp]"
    aliases: [seasons]
  seasonpass:
    description: "Season pass menu"
    usage: "/seasonpass"
    aliases: [sp, pass]
  goat:
    description: "G.O.A.T. leaderboard"
    usage: "/goat"
    aliases: [bestplayer, top, leaderboard]

  # ── Cosmetics & Fun ────────────────────────────────────────────────────────
  cosmetics:
    description: "Open cosmetics menu"
    usage: "/cosmetics"
    aliases: [cos, skins]
  ally:
    description: "Manage your allies"
    usage: "/ally [list|level|feed]"
    aliases: [allies]
  sit:
    description: "Sit on the ground"
    usage: "/sit"
  lie:
    description: "Lie on the ground"
    usage: "/lie"
  lore:
    description: "Server lore"
    usage: "/lore"
  quests:
    description: "Quests menu"
    usage: "/quests"
    aliases: [quest]
  achievements:
    description: "View your achievements"
    usage: "/achievements"
    aliases: [achieve, ach]

  # ── Navigation ─────────────────────────────────────────────────────────────
  gameselector:
    description: "Open game selector"
    usage: "/gameselector"
    aliases: [games, gs, play]
  lobbyselector:
    description: "Open lobby selector"
    usage: "/lobbyselector"
    aliases: [lobbies, ls]
  gemsshop:
    description: "Open gems shop"
    usage: "/gemsshop"
    aliases: [gemshop, gems-shop]
  joinmessages:
    description: "Browse join message cosmetics"
    usage: "/joinmessages"
    aliases: [jm, joinmsg]

  # ── Admin / Debug ──────────────────────────────────────────────────────────
  permcheck:
    description: "Check a player's permission"
    usage: "/permcheck <player> <permission>"
    aliases: [pcheck]
  glimzo:
    description: "GlimzoCore admin commands"
    usage: "/glimzo <reload <ranks|config>|build>"
    aliases: [gc, core]
  restart:
    description: "Schedule a server restart"
    usage: "/restart [seconds|cancel]"
  dbstats:
    description: "Show HikariCP connection pool stats"
    usage: "/dbstats"
