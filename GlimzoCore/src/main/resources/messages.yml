# messages.yml — GlimzoCore user-facing strings
# ================================================
# Theme: Forest & Greenery
#
# Colour guide:
#   &d  General / informational
#   &a  Success
#   &2  Promotional / server-official / advertisement
#   &c  Important alerts / errors
#   &e  Lightweight alerts / warnings
#   &7  Normal body text
#   &8  Subdued / decorative text
#
# Supports & colour codes and \n for newlines.
# {player}     = player name
# {rank}       = rank display name
# {rank_color} = rank colour code  e.g. &a
# {message}    = message content
# {reason}     = punishment reason
# {staff}      = staff member name
# {duration}   = formatted duration string
# {expires}    = formatted expiry timestamp

chat:
  # Main chat format. %2$s = the message (appended by ChatListener).
  format: "{rank_prefix} &f{player} &8» &f"

  # Private messages
  pm-sent:     "&8[&7You &8→ &7{player}&8] &f{message}"
  pm-received: "&8[&7{player} &8→ &7You&8] &f{message}"
  pm-spy:      "&8[&2SPY&8] &7{sender} &8→ &7{receiver}&8: &f{message}"

  # Chat errors
  pm-offline:       "&c&l✗ &cThat player is not online."
  pm-ignored:       "&c&l✗ &cYou have ignored that player."
  pm-self:          "&c&l✗ &cYou cannot message yourself."
  muted:            "&c&l✗ &cYou are muted and cannot chat."
  muted-expires:    "&c&l✗ &cYou are muted. Expires in: &e{expires}"
  no-reply-target:  "&c&l✗ &cNo one to reply to."

join-quit:
  # {rank_color}[{rank}] {player} {message}
  join-format: "{rank_color}&l[{rank}] &r&7{player} &8» &2{message}"
  quit-format: "{rank_color}&l[{rank}] &r&7{player} &8» &8left the forest"

  # Join messages (randomly picked or pinned via cosmetic)
  join-messages:
    - "emerged from the undergrowth"
    - "wandered in from the deep forest"
    - "arrived through the mossy gates"
    - "stepped out of the shadows"
    - "found a path through the trees"
    - "landed from the treetops"
    - "escaped the wild"
    - "entered the canopy"
    - "returned to the grove"
    - "descended from the highlands"
    - "rode in on the morning mist"
    - "slipped through the vines"

ban-screen:
  # Shown when a banned player tries to connect.
  header:    "&c&l  ✗  You are banned from this network.\n"
  reason:    "&7  Reason  &8» &f{reason}"
  permanent: "&7  Duration &8» &cPermanent"
  expires:   "&7  Expires  &8» &e{duration}"

mute-screen:
  header:    "&c&l✗ &cYou are muted."
  reason:    "&7Reason &8» &f{reason}"
  permanent: "&7Duration &8» &cPermanent"
  expires:   "&7Expires &8» &e{expires}"

db-load-error: "&c&l✗ &cFailed to load your player data. Please reconnect. If this persists, contact staff."

restart:
  now:       "&c&l⚠ &c&lServer restarting now! See you in the forest soon."
  countdown: "&e&l⚠ &eServer restart in &c{time}&e."

warn:
  received: "&c&l⚠ &c&lWarning &c— &f{reason}"
