# lore.yml - Server lore chapters and entries
# ============================================
# Each chapter has a title and a list of entries.
# Each entry has an id, title, and multi-line content.
#
# Usage: /lore - opens the LoreMenu showing all chapters and entries.

chapters:
  - title: "The Beginning"
    entries:
      - id: "origins"
        title: "Origins"
        content:
          - "&7Long ago, the Glimzo network was founded by a group"
          - "&7of adventurers seeking a new world to call home."
          - ""
          - "&7They carved out their place in the digital realm,"
          - "&7building what would become the greatest server around."

  - title: "The World"
    entries:
      - id: "world_overview"
        title: "Overview"
        content:
          - "&7The Glimzo world spans across many realms,"
          - "&7each with its own unique challenges and rewards."
          - ""
          - "&7Explore, build, and conquer to make your mark."

